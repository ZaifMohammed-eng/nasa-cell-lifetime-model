# FastAPI forecast service. Loads models:/cell-eol-forecaster@champion at start-up,
# so run the training pipeline first. Restart the deployment to pick up a new champion:
#   kubectl -n kubeflow rollout restart deploy/eol-forecaster
apiVersion: apps/v1
kind: Deployment
metadata: {name: eol-forecaster, namespace: kubeflow, labels: {app: eol-forecaster}}
spec:
  replicas: 2
  selector: {matchLabels: {app: eol-forecaster}}
  template:
    metadata:
      labels: {app: eol-forecaster}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: api
          image: ghcr.io/zaifmohammed-eng/cell-eol-forecaster:1.0.0
          command: ["uvicorn", "serve.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          env:
            - {name: MODEL_URI, value: "models:/cell-eol-forecaster@champion"}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow.kubeflow.svc.cluster.local:5000"}
            # Optional: score the challenger in shadow mode (roughly halves capacity).
            # - {name: SHADOW_MODEL_URI, value: "models:/cell-eol-forecaster@challenger"}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: eol-forecaster, namespace: kubeflow}
spec:
  selector: {app: eol-forecaster}
  ports: [{port: 8000, targetPort: 8000}]
